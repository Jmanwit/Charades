<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charades Time</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E8F4FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charades Time">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#E8F4FF;--ink:#14213D;--panel:#fff;--line:#14213D;--go:#2DC653;--stop:#E5383B;--soft:#c9dcf0;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B33;--ink:#F2F6FF;--panel:#1B2A4A;--line:#000;--soft:#2c4068}}
:root[data-theme="dark"]{--bg:#0F1B33;--ink:#F2F6FF;--panel:#1B2A4A;--line:#000;--soft:#2c4068}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:20px;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:520px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:34px;margin:6px 0 2px;font-weight:800}
h2{font-size:22px;margin:18px 0 8px;font-weight:800}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:3px solid var(--line);border-radius:18px;background:var(--panel);padding:10px 14px;font-weight:800;box-shadow:0 5px 0 var(--line);margin:0 0 10px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.4}
.go{background:var(--go);color:#0b2a14;font-size:28px;padding:14px}
.stop{background:var(--stop);color:#fff;font-size:28px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:70px;border:3px solid var(--line);border-radius:14px;background:var(--panel);padding:6px 8px;font-weight:700;text-align:center}
.chip.on{background:var(--ink);color:var(--bg)}
input{font:inherit;width:100%;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--panel);color:var(--ink);margin-bottom:10px}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);padding:0}
.sw.on{outline:4px solid var(--ink);outline-offset:2px}
.sw[disabled]{opacity:.2}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);flex:none}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:4px 8px;margin-bottom:8px}
.pl b{flex:1}
.pl button{border:0;background:none;font-size:26px}
.score{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.pill{display:flex;align-items:center;gap:6px;border:3px solid var(--line);border-radius:999px;padding:2px 12px 2px 4px;background:var(--panel);font-weight:800;white-space:nowrap}
.pill.act{background:var(--ink);color:var(--bg)}
.pill .dot{width:24px;height:24px}
.card{width:100%;height:46vh;min-height:260px;max-height:420px;border:4px solid var(--line);border-radius:28px;box-shadow:0 8px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:6px 0 20px;font-weight:800;text-align:center;padding:10px}
.card.down{background:repeating-linear-gradient(45deg,#1d3a8a 0 16px,#264bb5 16px 32px);color:#fff}
.card.up{background:#fff;color:#14213D}
.card .big{font-size:120px;line-height:1.05}
.card .word{font-size:44px}
.card .q{font-size:90px}
.card .hint{font-size:20px;opacity:.9}
.timer{font-size:120px;line-height:1}
.bar{width:80%;height:14px;border-radius:9px;background:rgba(255,255,255,.35);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#FFC300}
.who{position:fixed;inset:0;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 28px;overflow:auto;z-index:5}
.who .pl{padding:10px 12px;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.who .dot{width:44px;height:44px}
small{opacity:.75}
</style></head><body><main>

<section id="setup">
  <h1>🎭 Charades Time</h1>
  <small>Add players, pick a color, then play.</small>
  <h2>Players</h2>
  <div id="plist"></div>
  <input id="nm" maxlength="14" placeholder="Name" autocomplete="off">
  <div class="row" id="sws" style="margin-bottom:12px"></div>
  <button class="btn" id="add">Add player</button>
  <h2>Turn length</h2>
  <div class="row" id="durs"></div>
  <h2>Play until</h2>
  <div class="row" id="tgts"></div>
  <div style="height:16px"></div>
  <button class="btn go" id="start">Start game</button>
</section>

<section id="game" class="hide">
  <div class="score" id="score"></div>
  <div class="pill act" style="display:inline-flex;margin-bottom:6px"><span class="dot" id="adot"></span><span id="aname"></span>&nbsp;is acting</div>
  <div class="card down" id="card"></div>
  <button class="btn go" id="ready">Ready!</button>
  <button class="btn stop hide" id="got">SOMEONE GOT IT!</button>
  <button class="btn hide" id="quit" style="margin-top:18px;font-size:16px">End game</button>
  <button class="btn" id="menu" style="margin-top:18px;font-size:16px">Settings</button>
</section>

<section id="win" class="hide">
  <h1 id="wt">🏆</h1>
  <div id="wl" style="margin:14px 0"></div>
  <button class="btn go" id="again">Play again</button>
  <button class="btn" id="back">Change players</button>
</section>
</main>

<div class="who hide" id="who">
  <h1>Who got it?</h1>
  <div id="answer"></div>
  <div id="wlist"></div>
  <button class="btn" id="nobody">Nobody 😅</button>
</div>

<script>
const $=s=>document.querySelector(s);
const WORDS=("🐶 Dog,🐱 Cat,🐘 Elephant,🦒 Giraffe,🐒 Monkey,🦁 Lion,🐧 Penguin,🐸 Frog,🐍 Snake,🦋 Butterfly,🐢 Turtle,🦈 Shark,🐙 Octopus,🐰 Rabbit,🐻 Bear,🦘 Kangaroo,🐔 Chicken,🐷 Pig,🐮 Cow,🐴 Horse,🦆 Duck,🦉 Owl,🐊 Crocodile,🐬 Dolphin,🦇 Bat,🕷️ Spider,🐝 Bee,🦀 Crab,🐌 Snail,🦅 Eagle,🐑 Sheep,🦓 Zebra,🐼 Panda,🦖 Dinosaur,"+
"🧑‍🚒 Firefighter,🧑‍🍳 Chef,🧑‍⚕️ Doctor,👮 Police Officer,🧑‍🚀 Astronaut,🧑‍🏫 Teacher,🧑‍🎨 Painter,🧑‍🌾 Farmer,🧑‍✈️ Pilot,🧑‍🔧 Mechanic,🧙 Wizard,🦸 Superhero,🤡 Clown,🧑‍🎤 Singer,💂 Guard,🥷 Ninja,🏴‍☠️ Pirate,🧜 Mermaid,👸 Princess,🧑‍🔬 Scientist,👷 Builder,🧑‍⚖️ Judge,🕵️ Detective,🧑‍💻 Programmer,📸 Photographer,🤵 Waiter,🧛 Vampire,🧟 Zombie,🧑‍🎓 Student,🏇 Jockey,🎅 Santa,🧚 Fairy,🥋 Karate Kid,"+
"🏃 Run,🏊 Swim,😴 Sleep,🍽️ Eat,🥤 Drink,💃 Dance,🎤 Sing,😂 Laugh,😭 Cry,🦘 Jump,🧗 Climb,⛳ Golf,🚴 Bike,🛁 Take a Bath,🪥 Brush Teeth,📖 Read,✍️ Write,🎨 Paint,🎣 Fish,🤧 Sneeze,🥱 Yawn,👏 Clap,🚶 Walk,⚽ Kick,🤸 Cartwheel,🧹 Sweep,🚿 Take a Shower,📞 Phone Call,🤳 Take a Selfie,🪁 Fly a Kite,🎹 Play Piano,🎸 Play Guitar,🤝 Shake Hands").split(",");
const COLORS=[["Red","#E5383B"],["Orange","#FB8500"],["Yellow","#FFC300"],["Green","#2DC653"],["Blue","#1E88E5"],["Purple","#8E44AD"],["Pink","#FF5DA2"],["Brown","#8D5524"]];
const DURS=[15,30,90,120], TGTS=[0,5,10,15,20];
let S={players:[],dur:30,target:0};
try{const r=localStorage.getItem("charades");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("charades",JSON.stringify(S))}catch(e){}};
let pick=null,deck=[],card=null,actor=0,face="down",seen=false,phase="prep",end=0,tm=null;

function show(id){["setup","game","win"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id))}
function renderSetup(){
  const used=S.players.map(p=>p.color);
  if(pick&&used.includes(pick))pick=null;
  $("#sws").innerHTML=COLORS.map(([n,c])=>`<button class="sw ${pick===c?"on":""}" style="background:${c}" aria-label="${n}" data-c="${c}" ${used.includes(c)?"disabled":""}></button>`).join("");
  $("#plist").innerHTML=S.players.map((p,i)=>`<div class="pl"><span class="dot" style="background:${p.color}"></span><b>${p.name}</b><button data-r="${i}" aria-label="Remove">✕</button></div>`).join("")||"<small>No players yet</small>";
  $("#durs").innerHTML=DURS.map(d=>`<button class="chip ${S.dur===d?"on":""}" data-d="${d}">${d}s</button>`).join("");
  $("#tgts").innerHTML=TGTS.map(t=>`<button class="chip ${S.target===t?"on":""}" data-t="${t}">${t?t+" pts":"No limit"}</button>`).join("");
  $("#start").disabled=S.players.length<2;
}
$("#sws").onclick=e=>{const c=e.target.dataset.c;if(c){pick=c;renderSetup()}};
$("#plist").onclick=e=>{const r=e.target.dataset.r;if(r!==undefined){S.players.splice(+r,1);save();renderSetup()}};
$("#durs").onclick=e=>{const d=e.target.dataset.d;if(d){S.dur=+d;save();renderSetup()}};
$("#tgts").onclick=e=>{const t=e.target.dataset.t;if(t!==undefined){S.target=+t;save();renderSetup()}};
$("#add").onclick=()=>{
  const n=$("#nm").value.trim();
  if(!n){$("#nm").focus();return}
  if(!pick){alert("Pick a color first!");return}
  if(S.players.length>=8)return;
  S.players.push({name:n,color:pick,score:0});pick=null;$("#nm").value="";save();renderSetup();
};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){if(!deck.length)deck=shuffle(WORDS.slice());return deck.pop()}
function startGame(){S.players.forEach(p=>p.score=0);actor=0;deck=[];save();show("game");newTurn()}
function newTurn(){card=draw();face="down";seen=false;phase="prep";renderGame()}
function renderGame(){
  const p=S.players[actor];
  $("#adot").style.background=p.color;$("#aname").textContent=p.name;
  $("#score").innerHTML=S.players.map((q,i)=>`<div class="pill ${i===actor?"act":""}"><span class="dot" style="background:${q.color}"></span>${q.score}</div>`).join("");
  const c=$("#card"),sp=card.indexOf(" "),em=card.slice(0,sp),w=card.slice(sp+1);
  if(phase==="run"){
    c.className="card down";
    const left=Math.max(0,Math.ceil((end-Date.now())/1000));
    c.innerHTML=`<div class="timer">${left}</div><div class="bar"><i style="width:${Math.max(0,(end-Date.now())/(S.dur*10))}%"></i></div>`;
  }else if(face==="up"){
    c.className="card up";c.innerHTML=`<div class="big">${em}</div><div class="word">${w}</div><div class="hint">Tap to hide</div>`;
  }else{
    c.className="card down";c.innerHTML=`<div class="q">❓</div><div class="hint">${seen?"Tap to peek again":"Tap to see your card"}</div>`;
  }
  $("#ready").classList.toggle("hide",phase==="run");
  $("#ready").disabled=!seen;
  $("#got").classList.toggle("hide",phase!=="run");
  $("#menu").classList.toggle("hide",phase==="run");
}
$("#card").onclick=()=>{if(phase!=="prep")return;face=face==="down"?"up":"down";if(face==="up")seen=true;renderGame()};
$("#ready").onclick=()=>{
  face="down";phase="run";end=Date.now()+S.dur*1000;renderGame();
  tm=setInterval(()=>{if(Date.now()>=end){clearInterval(tm);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}openWho()}else renderGame()},200);
};
$("#got").onclick=()=>{clearInterval(tm);openWho()};
$("#menu").onclick=()=>{show("setup");renderSetup()};

function openWho(){
  const sp=card.indexOf(" "),em=card.slice(0,sp),w=card.slice(sp+1);
  $("#answer").innerHTML=`<small>The card was:</small><div class="card up" style="height:auto;min-height:0;max-height:none;padding:14px;margin:6px 0 16px"><div class="big" style="font-size:90px">${em}</div><div class="word">${w}</div></div>`;
  $("#wlist").innerHTML=S.players.map((p,i)=>i===actor?"":`<div class="pl" data-w="${i}"><span class="dot" style="background:${p.color}"></span><b>${p.name}</b></div>`).join("");
  $("#who").classList.remove("hide");
}
$("#wlist").onclick=e=>{const el=e.target.closest("[data-w]");if(el)finish(+el.dataset.w)};
$("#nobody").onclick=()=>finish(-1);
function finish(i){
  $("#who").classList.add("hide");
  if(i>=0){S.players[i].score++;S.players[actor].score++}
  save();
  const top=Math.max(...S.players.map(p=>p.score));
  if(S.target&&top>=S.target)return showWin(top);
  actor=(actor+1)%S.players.length;newTurn();
}
function showWin(top){
  const ws=S.players.filter(p=>p.score===top);
  $("#wt").textContent=ws.length>1?"🏆 It's a tie!":"🏆 We have a winner!";
  $("#wl").innerHTML=S.players.slice().sort((a,b)=>b.score-a.score).map(p=>`<div class="pl" style="font-size:28px;font-weight:800"><span class="dot" style="background:${p.color};width:44px;height:44px"></span><b>${p.name}</b>${p.score}${p.score===top?" 🏆":""}</div>`).join("");
  show("win");
}
$("#again").onclick=startGame;
$("#start").onclick=startGame;
$("#back").onclick=()=>{show("setup");renderSetup()};
renderSetup();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body></html>
